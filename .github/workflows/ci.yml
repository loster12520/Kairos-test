name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install acceptance tooling and all browsers
        run: |
          cd tools && npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Publish framework and assemble the demo
        run: |
          ./gradlew -PframeworkOnly=true publishToMavenLocal
          ./gradlew :demo-web:assembleSite

      - name: Cross-browser check (Chromium, Firefox, WebKit)
        run: node tools/cross-browser-check.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22 (Kotlin/JS toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The sample apps apply the published dev.kairos plugin, so the framework has to be in
      # mavenLocal before Gradle configures them.
      - name: Publish framework to mavenLocal
        run: ./gradlew -PframeworkOnly=true publishToMavenLocal

      - name: Build, unit tests and API compatibility
        run: |
          ./gradlew build
          ./gradlew apiCheck

      - name: Assemble the static demo
        run: ./gradlew :demo-web:assembleSite

      - name: Install acceptance tooling
        run: cd tools && npm ci

      - name: Artifact, browser and consumer acceptance
        run: |
          node tools/verify.mjs --rebuild
          node tools/browser-check.mjs
          node tools/style-browser-check.mjs
          node tools/runtime-check.mjs
          node tools/consumer-check.mjs
          node tools/library-check.mjs
          node tools/starter-check.mjs
          node tools/docs-check.mjs
          node tools/a11y-check.mjs
          node tools/cascade-check.mjs
          node tools/benchmark.mjs

      - name: End-to-end acceptance (blog)
        run: bash tools/e2e-ci.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-build-output
          path: |
            demo-web/build/site
            demo-web/build/kairos
            blog-backend/build/kairos
            examples/consumer-static/build
